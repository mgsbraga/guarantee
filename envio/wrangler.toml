# Publicação do recebedor de notas pela linha de comando.
#
# De dentro desta pasta (sistema/envio), depois de  node guarantee.mjs envio :
#
#   npx wrangler login                          abre o navegador uma vez, para autorizar
#   npx wrangler r2 bucket create guarantee-envios
#   npx wrangler secret put SEGREDO_ADMIN       cole o segredo que o "envio" imprimiu
#   npx wrangler deploy                         publica e imprime a URL
#
# Nenhum segredo mora neste arquivo.

name = "guarantee-envios"
main = "dist/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[[r2_buckets]]
binding = "ENVIOS"
bucket_name = "guarantee-envios"

[observability]
enabled = true
